<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>

    <style>
      body {
        font-family: Arial;
        background: #f9f9f9;
        margin: 0;
      }

      nav {
        background: #1e90ff;
        padding: 15px;
        color: white;
        display: flex;
        justify-content: space-between;
      }

      .container {
        max-width: 1000px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
      }

      .profile-picture {
        width: 130px;
        border-radius: 50%;
      }

      button {
        padding: 10px 20px;
        background: #1e90ff;
        color: white;
        border: none;
        cursor: pointer;
      }
      #inner {
        display: flex;
        justify-content: space-around;
      }
    </style>
  </head>

  <body>
    <nav>
      <div>SMART DASHBOARD</div>
      <button id="logoutBtn">Logout</button>
    </nav>

    <div class="container">
      <h2>User Profile</h2>
      <div id="inner">
        <div>
          <p><strong>Username:</strong> <span id="username"></span></p>
          <p><strong>Email:</strong> <span id="email"></span></p>
          <p><strong>Mobile:</strong> <span id="mobile"></span></p>
        </div>
        <div>
          <img
            id="profilePic"
            class="profile-picture"
            src="chatbot image.webp"
          />
        </div>
      </div>
    </div>

    <!-- 🔥 FIREBASE SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

      // Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyAwGcx4ZovfBjBdQjZr0TLVDAWsDOP3MxM",
        authDomain: "smart-student-dashboard-0.firebaseapp.com",
        projectId: "smart-student-dashboard-0",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // 🔐 Check login
      onAuthStateChanged(auth, (user) => {
        if (user) {
          // Show user data
          document.getElementById("username").textContent = user.email;
          document.getElementById("email").textContent = user.email;

          // As you wanted
          document.getElementById("mobile").textContent = user.email;
        } else {
          // Not logged in → redirect
          window.location.href = "login.html";
        }
      });

      // 🚪 Logout
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
