<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Watermark Tool</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; text-align: center; margin-top: 50px; }
        form { display: inline-block; padding: 20px; background-color: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="file"], input[type="text"] { margin-bottom: 10px; }
        input[type="submit"] { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        input[type="submit"]:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>Upload PDF to Add Watermark</h1>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file"><br>
        <input type="text" name="watermark" placeholder="Enter Watermark Text"><br>
        <input type="submit" value="Add Watermark">
<center>
        <img src="icon for add to watermark in a pdf.png" height="200px" width="200px"alt="Description of the image">
</center>

    </form>
    <script src="code(watermark).js"></script>
</body>
